name: Teste de vozes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vozes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q edge-tts==7.3.1
      - name: Gerar vozes
        shell: python
        run: |
          import asyncio, json, os, edge_tts
          FALAS = [
            "Seu filhote chora a noite inteira? Não é manha.",
            "Ele dormia grudado na mãe e nos irmãos. Agora acordou sozinho num lugar estranho.",
            "Nas primeiras noites, deixe a caminha perto da sua cama, com uma roupa com o seu cheiro.",
            "Antes de dormir, brincadeira e xixi. No chorinho, acalme só com a voz, sem festa.",
            "Salva pra hoje à noite.",
          ]
          VARIANTES = {
            "antonio_jovem": ("pt-BR-AntonioNeural", "+8%", "+18Hz"),
          }
          os.makedirs("out", exist_ok=True)
          async def main():
              vs = await edge_tts.list_voices()
              json.dump([v["ShortName"] for v in vs if v["Locale"].startswith("pt")], open("out/vozes.json", "w"))
              for nome, (voz, rate, pitch) in VARIANTES.items():
                  for i, fala in enumerate(FALAS):
                      try:
                          com = edge_tts.Communicate(fala, voz, rate=rate, pitch=pitch, boundary="WordBoundary")
                          pal = []
                          with open(f"out/{nome}_{i}.mp3", "wb") as f:
                              async for ch in com.stream():
                                  if ch["type"] == "audio":
                                      f.write(ch["data"])
                                  elif ch["type"] == "WordBoundary":
                                      pal.append([ch["offset"] / 1e7, (ch["offset"] + ch["duration"]) / 1e7, ch["text"]])
                          json.dump(pal, open(f"out/{nome}_{i}.json", "w"), ensure_ascii=False)
                      except Exception as e:
                          print("falhou", nome, i, e)
          asyncio.run(main())
      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "vozes-$(date +%H%M%S)" out/* --prerelease --title "Teste de vozes" -R "$GITHUB_REPOSITORY"
